name: Import D1 SQL

on:
  workflow_dispatch:
    inputs:
      database:
        description: D1 database name from wrangler.jsonc
        required: true
        default: flora-atlas
      sql_file:
        description: Path to a committed SQL file under db/import/
        required: true
        default: db/import/import.sql

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate SQL path
        shell: bash
        run: |
          case "${{ inputs.sql_file }}" in
            db/import/*.sql) ;;
            *) echo "SQL imports must live under db/import/"; exit 1 ;;
          esac
          test -f "${{ inputs.sql_file }}"

      - name: Execute SQL on D1
        run: npx wrangler d1 execute "${{ inputs.database }}" --remote --file "${{ inputs.sql_file }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
