name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Apply D1 migrations and content schema before deploy
        required: false
        default: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static assets
        run: npm run build:deploy

      - name: Apply main D1 migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations == 'true' }}
        run: npx wrangler d1 migrations apply flora-atlas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply content D1 schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations == 'true' }}
        run: |
          npx wrangler d1 execute plants-content-01 --remote --file migrations/content/0001_wikipedia_sources.sql
          npx wrangler d1 execute plants-content-01 --remote --file migrations/content/0002_wiki_import_state.sql
          npx wrangler d1 execute plants-content-01 --remote --file migrations/content/0003_wikipedia_article_extracts.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve D1 database IDs for enrichment Worker
        run: npx wrangler d1 list --json > .wrangler-d1-list.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate enrichment Worker config
        run: node scripts/write-enrichment-wrangler-config.mjs .wrangler-d1-list.json wrangler.enrichment.generated.jsonc
        env:
          CONTENT_D1_DATABASE_ID: ${{ secrets.CONTENT_D1_DATABASE_ID }}

      - name: Deploy Wikimedia enrichment Worker
        run: npx wrangler deploy --config wrangler.enrichment.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
